  construir_appbundle:
    name: Build Flutter (Android)
    needs: [ejecutar_pruebas]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v1
        with:
          channel: "stable"
      - name: Instalar dependencias 📦
        run: flutter pub get
        working-directory: .
      - name: Crear archivo .env 📝
        run: |
          if [ "${{ env.FLAVOR }}" = "prod" ]; then
            echo "${{ secrets.ENV_PROD }}" > .env.prod
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID_PROD }}" >> .env.prod
            echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID_PROD }}" >> .env.prod
            echo "ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID_PROD }}" >> .env.prod
          else
            echo "${{ secrets.ENV_DEV }}" > .env.dev
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID_DEV }}" >> .env.dev
            echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID_DEV }}" >> .env.dev
            echo "ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID_DEV }}" >> .env.dev
          fi
      - name: Crear archivos .env si faltan 🧩
        run: |
          touch .env.dev
          touch .env.prod
      - name: Limpiar proyecto 🧹
        run: flutter clean
        working-directory: .
      - name: Configurar firma de Android 🔑
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
      - name: Verificar archivos de firma (Debug) 🔍
        run: |
          echo "Contenido de android/:"
          ls -l android/key.properties || echo "key.properties no encontrado"
          echo "Contenido de android/app/:"
          ls -l android/app/upload-keystore.jks || echo "keystore no encontrado"
      - name: Construir aplicación 🚀
        run: |
          if [ "${{ env.FLAVOR }}" = "prod" ]; then
            flutter build apk --flavor prod --release --target=lib/env/main.prod.dart
          else
            flutter build apk --flavor dev --release --target=lib/env/main.dev.dart
          fi
        working-directory: .
      - name: Determinar Firebase App ID 🆔
        id: firebase_app_id
        run: |
          if [ "${{ env.FLAVOR }}" = "prod" ]; then
            echo "app_id=${{ secrets.FIREBASE_ANDROID_APP_ID_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "app_id=${{ secrets.FIREBASE_ANDROID_APP_ID_DEV }}" >> $GITHUB_OUTPUT
          fi
      - name: Subir a Firebase App Distribution 🔥
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ steps.firebase_app_id.outputs.app_id }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-${{ env.FLAVOR }}-release.apk

      - name: Construir App Bundle para Google Play 📦
        if: env.FLAVOR == 'prod'
        run: flutter build appbundle --flavor prod --release --target=lib/env/main.prod.dart
        working-directory: .

      - name: Subir a Google Play (Vía Interna) 🚀
        if: env.FLAVOR == 'prod'
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vihomeapp.vihomeapp
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          status: completed
