name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop", "release"]

env:
  # Corrige la detección de prod en PRs evaluando la rama destino (base_ref)
  FLAVOR: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'prod' || 'dev' }}

jobs:
  ejecutar_pruebas:
    name: Ejecutar pruebas del proyecto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true # Habilita caché de Flutter y dependencias pub

      - name: Instalar dependencias 📦
        run: flutter pub get

      - name: Crear archivos .env 📝
        run: |
          if [ "${{ env.FLAVOR }}" = "prod" ]; then
            echo "${{ secrets.ENV_PROD }}" > .env.prod
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID_PROD }}" >> .env.prod
            echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID_PROD }}" >> .env.prod
            echo "ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID_PROD }}" >> .env.prod
          else
            echo "${{ secrets.ENV_DEV }}" > .env.dev
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID_DEV }}" >> .env.dev
            echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID_DEV }}" >> .env.dev
            echo "ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID_DEV }}" >> .env.dev
          fi
          # Asegura la existencia de ambos archivos para evitar fallos si la app los requiere
          touch .env.dev .env.prod

      - name: Analizar código 🧐
        run: flutter analyze

      - name: Ejecutar pruebas 🧪
        run: flutter test --flavor ${{ env.FLAVOR }}

  construir_appbundle:
    name: Build & Deploy (Android)
    needs: [ejecutar_pruebas]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Caché de Gradle 🐘
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Instalar dependencias 📦
        run: flutter pub get

      - name: Crear archivos .env 📝
        run: |
          if [ "${{ env.FLAVOR }}" = "prod" ]; then
            echo "${{ secrets.ENV_PROD }}" > .env.prod
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID_PROD }}" >> .env.prod
            echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID_PROD }}" >> .env.prod
            echo "ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID_PROD }}" >> .env.prod
          else
            echo "${{ secrets.ENV_DEV }}" > .env.dev
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID_DEV }}" >> .env.dev
            echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID_DEV }}" >> .env.dev
            echo "ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID_DEV }}" >> .env.dev
          fi
          touch .env.dev .env.prod

      - name: Configurar firma de Android 🔑
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties

      - name: Construir APK 🚀
        run: |
          flutter build apk \
            --flavor ${{ env.FLAVOR }} \
            --release \
            --target=lib/env/main.${{ env.FLAVOR }}.dart \
            --build-number=${{ github.run_number }}

      - name: Determinar Firebase App ID y Ruta del APK 🆔
        id: firebase_config
        run: |
          if [ "${{ env.FLAVOR }}" = "prod" ]; then
            echo "app_id=${{ secrets.FIREBASE_ANDROID_APP_ID_PROD }}" >> $GITHUB_OUTPUT
            echo "apk_path=build/app/outputs/flutter-apk/app-prod-release.apk" >> $GITHUB_OUTPUT
          else
            echo "app_id=${{ secrets.FIREBASE_ANDROID_APP_ID_DEV }}" >> $GITHUB_OUTPUT
            echo "apk_path=build/app/outputs/flutter-apk/app-dev-release.apk" >> $GITHUB_OUTPUT
          fi

      - name: Subir a Firebase App Distribution 🔥
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ steps.firebase_config.outputs.app_id }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: ${{ steps.firebase_config.outputs.apk_path }}

      - name: Construir App Bundle para Google Play 📦
        if: env.FLAVOR == 'prod'
        run: |
          flutter build appbundle \
            --flavor prod \
            --release \
            --target=lib/env/main.prod.dart \
            --build-number=${{ github.run_number }}

      - name: Subir a Google Play (Canal Interno) 🚀
        if: env.FLAVOR == 'prod'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vihomeapp.vihomeapp
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          tracks: internal
          status: completed

      - name: Limpiar credenciales temporales 🧼
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties