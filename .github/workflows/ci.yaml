name: CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop
      - release

jobs:
  ejecutar_pruebas:
    name: Ejecutar pruebas del proyecto
    runs-on: ubuntu-latest

    outputs:
      flavor: ${{ steps.set_flavor.outputs.flavor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determinar Flavor 🎯
        id: set_flavor
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || \
             [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "flavor=prod" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Java ☕
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Configurar Flutter 🐦
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias 📦
        run: flutter pub get

      - name: Crear archivos .env 📝
        shell: bash
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
          ENV_DEV: ${{ secrets.ENV_DEV }}
          GOOGLE_WEB_CLIENT_ID_PROD: ${{ secrets.GOOGLE_WEB_CLIENT_ID_PROD }}
          GOOGLE_WEB_CLIENT_ID_DEV: ${{ secrets.GOOGLE_WEB_CLIENT_ID_DEV }}
          ADMOB_BANNER_ID_PROD: ${{ secrets.ADMOB_BANNER_ID_PROD }}
          ADMOB_BANNER_ID_DEV: ${{ secrets.ADMOB_BANNER_ID_DEV }}
          ADMOB_INTERSTITIAL_ID_PROD: ${{ secrets.ADMOB_INTERSTITIAL_ID_PROD }}
          ADMOB_INTERSTITIAL_ID_DEV: ${{ secrets.ADMOB_INTERSTITIAL_ID_DEV }}
        run: |
          if [[ "${{ steps.set_flavor.outputs.flavor }}" == "prod" ]]; then

            printf '%s\n' "$ENV_PROD" \
              | grep -vE '^(APP_FLAVOR|DEBUG_MODE|GOOGLE_WEB_CLIENT_ID|ADMOB_BANNER_ID|ADMOB_INTERSTITIAL_ID)=' \
              > .env.prod || true

            {
              echo "APP_FLAVOR=prod"
              echo "DEBUG_MODE=false"
              echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID_PROD"
              echo "ADMOB_BANNER_ID=$ADMOB_BANNER_ID_PROD"
              echo "ADMOB_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID_PROD"
            } >> .env.prod

          else

            printf '%s\n' "$ENV_DEV" \
              | grep -vE '^(APP_FLAVOR|DEBUG_MODE|GOOGLE_WEB_CLIENT_ID|ADMOB_BANNER_ID|ADMOB_INTERSTITIAL_ID)=' \
              > .env.dev || true

            {
              echo "APP_FLAVOR=dev"
              echo "DEBUG_MODE=true"
              echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID_DEV"
              echo "ADMOB_BANNER_ID=$ADMOB_BANNER_ID_DEV"
              echo "ADMOB_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID_DEV"
            } >> .env.dev

          fi

          touch .env.dev .env.prod

      - name: Analizar código 🧐
        run: flutter analyze

      - name: Ejecutar pruebas 🧪
        run: flutter test


  construir_appbundle:
    name: Build & Deploy Android
    needs: ejecutar_pruebas
    runs-on: ubuntu-latest

    env:
      FLAVOR: ${{ needs.ejecutar_pruebas.outputs.flavor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java ☕
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Configurar Flutter 🐦
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Caché de Gradle 🐘
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Instalar dependencias 📦
        run: flutter pub get

      - name: Crear archivos .env 📝
        shell: bash
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
          ENV_DEV: ${{ secrets.ENV_DEV }}
          GOOGLE_WEB_CLIENT_ID_PROD: ${{ secrets.GOOGLE_WEB_CLIENT_ID_PROD }}
          GOOGLE_WEB_CLIENT_ID_DEV: ${{ secrets.GOOGLE_WEB_CLIENT_ID_DEV }}
          ADMOB_BANNER_ID_PROD: ${{ secrets.ADMOB_BANNER_ID_PROD }}
          ADMOB_BANNER_ID_DEV: ${{ secrets.ADMOB_BANNER_ID_DEV }}
          ADMOB_INTERSTITIAL_ID_PROD: ${{ secrets.ADMOB_INTERSTITIAL_ID_PROD }}
          ADMOB_INTERSTITIAL_ID_DEV: ${{ secrets.ADMOB_INTERSTITIAL_ID_DEV }}
        run: |
          if [[ "${{ env.FLAVOR }}" == "prod" ]]; then

            printf '%s\n' "$ENV_PROD" \
              | grep -vE '^(APP_FLAVOR|DEBUG_MODE|GOOGLE_WEB_CLIENT_ID|ADMOB_BANNER_ID|ADMOB_INTERSTITIAL_ID)=' \
              > .env.prod || true

            {
              echo "APP_FLAVOR=prod"
              echo "DEBUG_MODE=false"
              echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID_PROD"
              echo "ADMOB_BANNER_ID=$ADMOB_BANNER_ID_PROD"
              echo "ADMOB_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID_PROD"
            } >> .env.prod

          else

            printf '%s\n' "$ENV_DEV" \
              | grep -vE '^(APP_FLAVOR|DEBUG_MODE|GOOGLE_WEB_CLIENT_ID|ADMOB_BANNER_ID|ADMOB_INTERSTITIAL_ID)=' \
              > .env.dev || true

            {
              echo "APP_FLAVOR=dev"
              echo "DEBUG_MODE=true"
              echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID_DEV"
              echo "ADMOB_BANNER_ID=$ADMOB_BANNER_ID_DEV"
              echo "ADMOB_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID_DEV"
            } >> .env.dev

          fi

          touch .env.dev .env.prod

      - name: Configurar firma de Android 🔑
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Construir APK 🚀
        run: |
          flutter build apk \
            --flavor "${{ env.FLAVOR }}" \
            --release \
            --target="lib/env/main.${{ env.FLAVOR }}.dart" \
            --build-number="${{ github.run_number }}"

      - name: Determinar Firebase App ID y APK 🆔
        id: firebase_config
        shell: bash
        run: |
          if [[ "${{ env.FLAVOR }}" == "prod" ]]; then

            echo "app_id=${{ secrets.FIREBASE_ANDROID_APP_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "apk_path=build/app/outputs/flutter-apk/app-prod-release.apk" >> "$GITHUB_OUTPUT"

          else

            echo "app_id=${{ secrets.FIREBASE_ANDROID_APP_ID_DEV }}" >> "$GITHUB_OUTPUT"
            echo "apk_path=build/app/outputs/flutter-apk/app-dev-release.apk" >> "$GITHUB_OUTPUT"

          fi

      - name: Subir APK a Firebase App Distribution 🔥
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ steps.firebase_config.outputs.app_id }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: ${{ steps.firebase_config.outputs.apk_path }}

      # ============================================================
      # GOOGLE PLAY
      # Solo para Pull Request hacia MAIN y flavor PROD
      # ============================================================

      - name: Construir App Bundle para Google Play 📦
        if: ${{ env.FLAVOR == 'prod' && github.event_name == 'pull_request' && github.base_ref == 'main' }}
        run: |
          flutter build appbundle \
            --flavor prod \
            --release \
            --target="lib/env/main.prod.dart" \
            --build-number="${{ github.run_number }}"

      - name: Subir AAB a Google Play - Internal 🚀
        if: ${{ env.FLAVOR == 'prod' && github.event_name == 'pull_request' && github.base_ref == 'main' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vihomeapp.vihomeapp
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          tracks: internal
          status: completed

      # ============================================================
      # LIMPIEZA
      # ============================================================

      - name: Limpiar credenciales temporales 🧼
        if: always()
        shell: bash
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties
          rm -f .env.dev
          rm -f .env.prod